name: 🚀 Deploy FitLife Pro

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    
      # Baixa o projeto
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # Configura GitHub Pages
      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # Mostra arquivos do projeto
      - name: 📂 Listar arquivos
        run: ls -la

      # Verifica se index.html existe
      - name: ✅ Verificar index.html
        run: |
          if [ ! -f index.html ]; then
            echo "❌ index.html não encontrado!"
            exit 1
          fi

      # Compacta e envia arquivos
      - name: 📦 Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Publica o site
      - name: 🌍 Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Exibe URL final
      - name: 🔗 URL do site
        run: |
          echo "✅ Site publicado com sucesso!"
          echo "🌐 URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
