<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Controle de Dieta</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color:white;
      min-height:100vh;
      padding:30px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      width:100%;
      max-width:900px;
      background:#111827;
      border-radius:20px;
      padding:30px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      color:#22c55e;
      font-size:40px;
    }

    .form{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
      gap:15px;
      margin-bottom:25px;
    }

    input{
      padding:12px;
      border:none;
      border-radius:10px;
      outline:none;
      background:#1f2937;
      color:white;
      font-size:15px;
    }

    button{
      padding:12px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    button:hover{
      background:#16a34a;
      transform:scale(1.03);
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
      gap:20px;
      margin-bottom:25px;
    }

    .card{
      background:#1f2937;
      padding:20px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    .card h2{
      margin-bottom:10px;
      color:#38bdf8;
    }

    .card p{
      font-size:28px;
      font-weight:bold;
    }

    table{
      width:100%;
      border-collapse:collapse;
      overflow:hidden;
      border-radius:15px;
    }

    th, td{
      padding:15px;
      text-align:center;
    }

    th{
      background:#22c55e;
    }

    tr:nth-child(even){
      background:#1f2937;
    }

    tr:nth-child(odd){
      background:#111827;
    }

    .delete{
      background:#ef4444;
      padding:8px 12px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      color:white;
      font-weight:bold;
    }

    .delete:hover{
      background:#dc2626;
    }

    @media(max-width:700px){
      h1{
        font-size:28px;
      }

      table{
        font-size:13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🍎 Controle de Dieta</h1>

    <div class="form">
      <input type="text" id="food" placeholder="Nome do alimento">
      <input type="number" id="calories" placeholder="Calorias">
      <input type="number" id="protein" placeholder="Proteínas (g)">
      <input type="number" id="water" placeholder="Água (ml)">
      <button onclick="addMeal()">Adicionar</button>
    </div>

    <div class="cards">
      <div class="card">
        <h2>Calorias</h2>
        <p id="totalCalories">0</p>
      </div>

      <div class="card">
        <h2>Proteínas</h2>
        <p id="totalProtein">0g</p>
      </div>

      <div class="card">
        <h2>Água</h2>
        <p id="totalWater">0ml</p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Alimento</th>
          <th>Calorias</th>
          <th>Proteínas</th>
          <th>Água</th>
          <th>Ação</th>
        </tr>
      </thead>

      <tbody id="mealTable">
      </tbody>
    </table>

  </div>

  <script>
    let totalCalories = 0;
    let totalProtein = 0;
    let totalWater = 0;

    function addMeal(){

      const food = document.getElementById("food").value;
      const calories = Number(document.getElementById("calories").value);
      const protein = Number(document.getElementById("protein").value);
      const water = Number(document.getElementById("water").value);

      if(food === "" || calories <= 0){
        alert("Preencha os dados corretamente!");
        return;
      }

      totalCalories += calories;
      totalProtein += protein;
      totalWater += water;

      updateCards();

      const table = document.getElementById("mealTable");

      const row = table.insertRow();

      row.innerHTML = `
        <td>${food}</td>
        <td>${calories}</td>
        <td>${protein}g</td>
        <td>${water}ml</td>
        <td>
          <button class="delete" onclick="removeMeal(this, ${calories}, ${protein}, ${water})">
            Excluir
          </button>
        </td>
      `;

      document.getElementById("food").value = "";
      document.getElementById("calories").value = "";
      document.getElementById("protein").value = "";
      document.getElementById("water").value = "";
    }

    function removeMeal(button, calories, protein, water){

      totalCalories -= calories;
      totalProtein -= protein;
      totalWater -= water;

      updateCards();

      const row = button.parentElement.parentElement;
      row.remove();
    }

    function updateCards(){
      document.getElementById("totalCalories").innerText = totalCalories;
      document.getElementById("totalProtein").innerText = totalProtein + "g";
      document.getElementById("totalWater").innerText = totalWater + "ml";
    }
  </script>

</body>
</html>
